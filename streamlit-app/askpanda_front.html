<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ask PanDA – Launch</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      max-width: 600px;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    p {
      color: #555;
    }
    label {
      display: block;
      margin: 1rem 0 0.25rem;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .buttons {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .secondary {
      background: #f3f3f3;
      border: 1px solid #ccc;
    }
    .primary {
      background: #0366d6;
      color: white;
      border: 1px solid #024b9b;
    }
  </style>
</head>
<body>
  <h1>Ask PanDA</h1>
  <p>
    Start a chat with Ask PanDA. You can either send an initial question
    directly, or just launch the chat interface.
  </p>

  <!-- Form that redirects to the Streamlit app with ?q=... -->
  <form id="askForm" action="http://localhost:8502/chat" method="get" target="_blank">
    <label for="q">Your question for Ask PanDA</label>
    <input
      type="text"
      id="q"
      name="q"
      placeholder="e.g. Is the PanDA server alive?"
    />

    <div class="buttons">
      <!-- This submits the form with ?q=... and opens Streamlit in a new tab -->
      <button type="submit" class="primary">
        Send to Ask PanDA
      </button>

      <!-- This just opens the Streamlit chat without a question -->
      <button
        type="button"
        class="secondary"
        onclick="window.open('http://localhost:8502/chat', '_blank');"
      >
        Launch Ask PanDA
      </button>
    </div>
  </form>
</body>
</html>
